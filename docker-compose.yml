services:
  api:
    build:
      context: ./backend
    environment:
      DATA_DIR: /data
      SAMPLE_DOSSIER: /sample-dossier
      AUTO_LOAD_SAMPLE: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ledgerlens_data:/data
      - "./Uebungsdaten Muster Verpackungen:/sample-dossier:ro"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 35s

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  ledgerlens_data:
